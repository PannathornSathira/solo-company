[project]
name = "solo-company-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "google-genai>=2.13,<3",
]

[dependency-groups]
dev = [
  "pyyaml>=6,<7",
  "pytest>=8.4,<10",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "real_model: opt-in smoke tests that call a configured frontier model",
  "postgres: opt-in tests that require local PostgreSQL",
]

[tool.uv]
package = false
