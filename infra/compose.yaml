services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solo_company
      POSTGRES_PASSWORD: solo_company
      POSTGRES_USER: solo_company
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solo_company"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
